<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SC-3345 — Leadership Briefing · Read-Aloud Script</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --scale:1; --measure:46rem;
    --bg:#0b0f1a; --panel:#121829; --line:#26314d; --soft:#1a2238;
    --text:#f2f6ff; --muted:#9fb0cc; --dim:#6f82a8;
    --accent:#5db4ff; --num:#ffd166; --em:#7ef0c6; --cue:#c79bff; --warn:#ff9aa8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);
    font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  /* progress */
  .scroll{position:fixed;top:0;left:0;right:0;height:5px;background:transparent;z-index:50}
  .scroll > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--em))}
  /* top bar */
  .bar{position:sticky;top:0;z-index:40;background:rgba(11,15,26,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .bar .ttl{font-weight:800;letter-spacing:.01em}
  .bar .ttl small{display:block;color:var(--dim);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
  .bar .sp{flex:1}
  .bar button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;
    padding:.45rem .7rem;font-size:.86rem;cursor:pointer;font-weight:700}
  .bar button:hover{border-color:var(--accent)}
  .bar .time{color:var(--num);font-weight:800;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:.45rem .7rem;background:var(--panel)}
  /* layout */
  .wrap{max-width:var(--measure);margin:0 auto;padding:2.4rem 1.4rem 7rem}
  .head{border-bottom:2px solid var(--line);padding-bottom:1.4rem;margin-bottom:1.2rem}
  .head h1{font-size:calc(2.1rem * var(--scale));line-height:1.1;font-weight:850;letter-spacing:-.02em}
  .head .meta{margin-top:.9rem;color:var(--muted);font-size:calc(.98rem * var(--scale));display:flex;gap:.6rem 1.4rem;flex-wrap:wrap}
  .head .meta b{color:var(--text)}
  .sect{margin-top:2.6rem;scroll-margin-top:5rem}
  .sect h2{font-size:calc(1.05rem * var(--scale));letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
    font-weight:800;display:flex;align-items:baseline;gap:.7rem;border-left:4px solid var(--accent);padding-left:.8rem}
  .sect h2 .n{color:var(--dim);font-size:.85em}
  .sect h2 .t{margin-left:auto;color:var(--dim);font-size:.66em;letter-spacing:.06em;text-transform:none;font-weight:700}
  .say{font-size:calc(1.3rem * var(--scale));line-height:1.66;margin:1.05rem 0;max-width:100%;font-weight:450}
  .say .em{color:var(--em);font-weight:800}
  .say .num{color:var(--num);font-weight:800;white-space:nowrap}
  .cue{color:var(--cue);font-style:italic;font-size:calc(.98rem * var(--scale));margin:1rem 0;padding:.55rem .9rem;
    border-left:3px dashed var(--cue);background:rgba(199,155,255,.07);border-radius:0 8px 8px 0}
  .cue::before{content:"▶ delivery cue — ";font-style:normal;font-weight:800;letter-spacing:.04em;font-size:.8em;color:var(--cue);text-transform:uppercase}
  .qa{margin:1rem 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
  .qa .q{padding:.85rem 1.1rem;font-weight:800;font-size:calc(1.08rem * var(--scale));color:var(--warn);background:rgba(255,154,168,.08)}
  .qa .q::before{content:"Q — "}
  .qa .a{padding:.85rem 1.1rem;font-size:calc(1.18rem * var(--scale));line-height:1.6}
  .qa .a::before{content:"You say — ";font-weight:800;color:var(--em)}
  .end{margin-top:3rem;padding:1.4rem 1.6rem;border:1px solid var(--em);border-radius:14px;background:rgba(126,240,198,.06)}
  .end .say{margin:.4rem 0}
  /* dock nav */
  .dock{position:fixed;right:1rem;bottom:1rem;z-index:40;display:flex;flex-direction:column;gap:.4rem;align-items:flex-end}
  .dock .jump{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow:auto;display:none}
  .dock .jump.open{display:block}
  .dock .jump a{display:block;padding:.5rem .8rem;color:var(--muted);font-size:.85rem;text-decoration:none;border-bottom:1px solid var(--line);white-space:nowrap}
  .dock .jump a:hover{color:var(--text);background:var(--soft)}
  .dock .toggle{align-self:flex-end;background:var(--accent);color:#06121f;border:none;border-radius:999px;
    padding:.6rem 1rem;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .legend{color:var(--dim);font-size:calc(.86rem * var(--scale));margin-top:.6rem;display:flex;gap:1.2rem;flex-wrap:wrap}
  .legend span b{color:var(--em)} .legend span i{color:var(--num);font-style:normal;font-weight:800}
  /* light/print */
  body.light{--bg:#fbfcff;--panel:#fff;--line:#d8e0f0;--soft:#f2f6ff;--text:#0c1426;--muted:#3a4straight;--muted:#41506e;--dim:#7184a3;--accent:#0b6bd6;--num:#9a6b00;--em:#0f8f63;--cue:#7a3fd0;--warn:#c02a45}
  @media print{
    .scroll,.bar,.dock,.legend{display:none!important}
    body{background:#fff;color:#0c1426}
    :root{--text:#0c1426;--muted:#33415c;--num:#7a5200;--em:#0c7a54;--cue:#5a2da8;--accent:#0b6bd6;--line:#c9d3e6;--soft:#fff}
    .wrap{max-width:100%;padding:.5in}
    .say{font-size:13pt;line-height:1.5} .sect{page-break-inside:avoid}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

// inline markup: **bold/emphasis-on-read** and [[key number/term]]
function inline(text){
  const out=[]; let k=0,last=0,m;
  const re=/(\*\*([^*]+)\*\*|\[\[([^\]]+)\]\])/g;
  while((m=re.exec(text))){
    if(m.index>last) out.push(text.slice(last,m.index));
    if(m[2]!==undefined) out.push(<span className="em" key={k++}>{m[2]}</span>);
    else out.push(<span className="num" key={k++}>{m[3]}</span>);
    last=re.lastIndex;
  }
  if(last<text.length) out.push(text.slice(last));
  return out;
}

const SCRIPT=[
 {id:"open", title:"Opening — the headline first", blocks:[
   {cue:"Open calm and confident. This is good news wrapped around a problem. Don’t rush the first 20 seconds."},
   {say:"Thanks, everyone. I want to walk you through a pricing issue we found on quotes — what’s broken, why it happened, and what we’re going to do about it."},
   {say:"Let me give you the headline first. This is a [[configuration problem in our pricing engine]]. It is **not** a data-entry mistake, and it is **not** a defect in custom code. We have already confirmed the exact root cause, the fix is **low-risk and reversible**, and the only thing I need from this group today is [[two business decisions]]. I’ll keep the core to about ten minutes, and I have answers ready for the questions I expect."},
 ]},
 {id:"reported", title:"What was reported", blocks:[
   {say:"Here’s what triggered this. Wren saved a quote in our test environment, applied [[no discount at all]], and the quote came back with several dollar figures that were clearly wrong — all at the same time."},
   {say:"It showed a discount of roughly [[negative eleven thousand percent]]. That’s not a typo. The system reported a discount larger than the entire value of the quote, on a quote where nobody discounted anything."},
   {say:"The annualized license value — our ALE — read [[forty-six dollars]], when the real subscription value of the quote is over [[five thousand dollars]]."},
   {say:"And it showed a Total Services line of [[five hundred dollars]] — even though there are **no services on this quote at all**."},
   {cue:"Pause here. Let the three numbers land before you reframe."},
   {say:"So three different money fields, all wrong, on one ordinary quote. These are numbers we put in front of customers, so we treated it as **critical** right away."},
 ]},
 {id:"why", title:"Why it’s critical — and the honest scope", blocks:[
   {say:"Two things to help you size the risk. First, why it matters: these aren’t cosmetic fields buried in a back office. They drive [[the quote document the customer sees]], [[our approval thresholds]], and [[our annualized-revenue reporting]]. Wrong numbers here flow straight into customer trust and into our forecasting."},
   {say:"Second — and this is the reassuring part — we caught this [[in our test environment, on a test quote]]. There is **no confirmed customer impact today**."},
   {say:"But I want to be straight with you: the defect lives in the pricing engine’s configuration, which means **any** quote using our configuration-priced products would show these wrong numbers. So there is one open item I’m tracking — confirming whether our [[production]] environment is running this same pricing version. I’ll have that answer shortly and report back."},
 ]},
 {id:"mechanism", title:"What’s actually going wrong — the core mechanism", blocks:[
   {cue:"This is the ‘why’. Slow down. The price-tag analogy is the thing they’ll remember — deliver it deliberately."},
   {say:"Now, what’s actually going wrong. Let me give you the plain-English version first, then exactly one layer of detail."},
   {say:"Some of our products — think security products priced by the number of assets or users they protect — don’t have a single sticker price. Their real price is [[built up from the configuration]]. So the stored ‘list price’ on these products is essentially a placeholder, near zero, and the actual price the engine calculates is much higher."},
   {say:"Here’s the trap. Our pricing engine calculates the quote’s ‘Subtotal’ and ‘discount’ off that [[near-zero list price]], but it calculates the real total off the [[actual configured price]]. Those are two different measuring sticks."},
   {say:"The analogy: imagine a price tag that reads [[forty-six dollars]], but the register rings up the real configured price of [[five thousand two hundred dollars]]. The system compares the register total to the tag, sees the register is far higher, and concludes — incorrectly — that an enormous **negative discount** was applied. That is your negative-eleven-thousand-percent."},
 ]},
 {id:"defects", title:"The three symptoms, each explained", blocks:[
   {say:"That single mismatch cascades into the three symptoms. Let me take them in order."},
   {say:"**One — the phantom discount.** Because Subtotal is measured on the list base of forty-six dollars and the total is the real five thousand, the engine books the [[gap]] as a discount. And because the configured price is actually **higher** than list, the math flips the sign — so a price [[uplift]] gets reported as a large negative discount. The number reconciles exactly: the uplift across the two lines is [[five thousand one hundred eighty-five dollars]], and that is precisely the negative discount amount the quote shows."},
   {say:"**Two — the wrong ALE.** This one is almost trivial once you see it. Our ALE field is defined as [[equal to the Subtotal]]. It simply mirrors whatever Subtotal is. So the moment Subtotal is wrong at forty-six dollars, ALE is wrong at forty-six dollars. Fix Subtotal, and ALE corrects itself."},
   {say:"**Three — the phantom five-hundred-dollar Services total.** This is a separate, simpler bug. The engine totals services by category, but when a quote has **no** services, it doesn’t reset that field to zero — it just [[leaves whatever was there from a previous calculation]]. So an old five-hundred-dollar value is lingering. We confirmed the mechanism: a sibling ‘software total’ field shows blank precisely because it was never written, while the services field shows a stale value because it was written once and never cleared. There’s a built-in safety setting that would prevent exactly this — and it is currently turned [[off]]."},
 ]},
 {id:"versions", title:"The key insight — we’ve iterated at the wrong layer", blocks:[
   {cue:"Most important section. Make eye contact. This explains the frustration without blaming anyone."},
   {say:"Now the part I most want you to hear, because it explains why this has been frustrating. Our pricing engine configuration has [[seven saved versions]]. Only [[one — version six — is actually live]]."},
   {say:"The most recent one, [[version seven, was built but never turned on]]. And here is the key finding: version seven’s total-and-discount logic is [[identical]] to the live version. We compared them line by line. So switching to version seven would **not** fix this — it would carry the exact same bug forward."},
   {say:"The earlier versions were genuine improvements, but they were all aimed at [[line-level pricing details]] — not the [[header totals]] where this bug actually lives. So we’ve effectively iterated several times without ever touching the layer that’s broken. The payoff of this investigation is that we now know [[precisely which three settings]] are wrong, and where they live. The next change lands in the right place."},
 ]},
 {id:"confidence", title:"How confident we are", blocks:[
   {say:"Let me speak to confidence, because ‘we think we found it’ isn’t good enough for a critical issue. We pulled the [[live]] configuration directly from the environment and ran a thorough, cross-checked analysis across all seven versions."},
   {say:"[[Every single wrong number on that quote reconciles exactly]] to the configuration’s arithmetic — the negative discount, the forty-six-dollar subtotal and ALE, the five-thousand total, and the stale five hundred. We even chased down a suspicious reference in the discount formula that points at a field which [[doesn’t actually exist]] — a harmless leftover we’ll clean up, but not the cause. In short: this is well-understood, not a guess."},
 ]},
 {id:"fix", title:"The fix — configuration, not code", blocks:[
   {say:"So here’s the fix, and the headline is: [[it’s configuration, not code]]. No software release, no data migration."},
   {say:"We build [[one corrected version]] — call it version eight — cloned from version seven so we keep the recent pricing improvements, and we make [[three targeted changes]]."},
   {say:"First, we measure [[Subtotal on the same basis as the total]]. That single change fixes both the phantom discount **and** the ALE."},
   {say:"Second, we [[reset the category totals to zero on every calculation]], so a leftover like that five hundred dollars can never linger again."},
   {say:"Third, we stop treating a [[price uplift as a discount]] — when the configured price is above list, the discount shows zero, which is the truth."},
   {say:"Then we turn **on** that built-in safety setting as a backstop, we test on the exact quote Wren reported, and only then do we activate."},
 ]},
 {id:"decisions", title:"The two decisions I need from you", blocks:[
   {cue:"Look up from the script here. These are theirs to make — invite the discussion."},
   {say:"Two things are genuinely **your** call, because they’re about what the numbers should [[mean]], not how we build them."},
   {say:"[[Decision one — what should Subtotal and ALE represent?]] The net, real price the customer actually pays, or the stored list price? Every other total on the quote is already the net price, so my recommendation is [[net]] — it’s consistent, and it’s what customers expect. But if there’s a reason we report on list internally, I need to know."},
   {say:"[[Decision two — how should we treat a price that’s above list?]] When a configured product prices higher than its list, should the ‘discount’ simply show [[zero]], or do you want that uplift surfaced somewhere as its own number? My recommendation is zero, because an uplift isn’t a discount — but if finance wants visibility into the uplift, we add a dedicated field instead of hiding it."},
   {say:"Give me those two answers, and the fix is fully specified."},
 ]},
 {id:"risk", title:"Risk, reversibility, and scope", blocks:[
   {say:"On risk, I’d call it [[low to medium]]. Everything happens in the test environment first. It is [[instantly reversible]] — if anything looks off, we revert to the current live version in seconds. There’s no code and no data migration."},
   {say:"Two things we’ll be careful about. That safety setting we’re turning on is [[environment-wide]], so we won’t just test the one quote — we’ll run a broader regression across normal quotes, genuinely discounted quotes, and mixed quotes that actually have services, to make sure nothing else shifts. And we’ll confirm whether [[Orders]], not just Quotes, run through this same engine, so the fix covers them too."},
 ]},
 {id:"ask", title:"The ask and next steps", blocks:[
   {say:"So here is what I’m asking for today: [[approve the two decisions]], and give me the [[go-ahead to build and test]] the corrected version. Turning it on in production will come back to you as a [[separate, quick sign-off]] once it’s proven in test."},
   {say:"The sequence from there is straightforward: decisions today; build the corrected version; test it on Wren’s quote plus the regression set; activate in the test environment; and confirm the production-exposure question. I’ll bring back results before we touch anything live."},
 ]},
 {id:"qa", title:"Anticipated questions — read only if asked", blocks:[
   {cue:"Skip this section in the main read. It’s your back-pocket answers for Q&A."},
   {q:"Are customers affected right now?", a:"As far as we’ve confirmed, no — we found this in the test environment on a test quote. The open item is verifying production is on the same version, and that’s my immediate next step."},
   {q:"Why didn’t the earlier fixes catch this?", a:"Because they targeted line-level pricing, and this bug is in the header totals — a different layer. The good news is we now know exactly where it lives."},
   {q:"How long to fix?", a:"The build itself is small — a handful of configuration changes. The real time is testing and your two decisions. We’re talking days, not weeks, once we have the decisions."},
   {q:"Could we just reprice the affected quotes as a workaround?", a:"A reprice refreshes some values, but it won’t correct the measuring-stick problem or clear the stale services total — those need the version fix. So there’s no reliable manual workaround."},
   {q:"How sure are we this is the cause?", a:"Every wrong number on the quote matches the configuration’s math exactly, verified against the live setup across all seven versions. High confidence."},
   {q:"Whose change introduced it?", a:"It’s been in the totals logic across every version — it isn’t one person’s mistake; it’s a design assumption that breaks for configuration-priced products. What matters is we’ve isolated it and the fix is clear."},
 ]},
 {id:"close", title:"Close", end:true, blocks:[
   {say:"To bring it together: customer-facing pricing numbers are wrong because of a [[configuration mismatch]] in our pricing engine. We know the [[exact three settings]] to change, the fix is [[reversible and code-free]], and I need [[two business decisions]] to finish it. With those, we’ll have a tested fix ready quickly. Thank you — happy to take questions."},
 ]},
];

function wordCount(){
  let w=0;
  SCRIPT.forEach(s=>s.blocks.forEach(b=>{
    const t=(b.say||"")+" "+(b.a||"");
    if(t.trim()) w+=t.replace(/[*\[\]]/g,"").split(/\s+/).filter(Boolean).length;
  }));
  return w;
}
function mins(w){return Math.max(1,Math.round(w/130));} // ~130 spoken wpm

function App(){
  const [scale,setScale]=useState(1);
  const [measure,setMeasure]=useState(46);
  const [light,setLight]=useState(false);
  const [open,setOpen]=useState(false);
  const [prog,setProg]=useState(0);
  useEffect(()=>{document.documentElement.style.setProperty('--scale',scale);},[scale]);
  useEffect(()=>{document.documentElement.style.setProperty('--measure',measure+'rem');},[measure]);
  useEffect(()=>{document.body.classList.toggle('light',light);},[light]);
  useEffect(()=>{
    const onScroll=()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);setProg(Math.min(1,Math.max(0,p)));};
    window.addEventListener('scroll',onScroll,{passive:true});onScroll();return()=>window.removeEventListener('scroll',onScroll);
  },[]);
  useEffect(()=>{
    const h=e=>{
      if(e.key==='+'||e.key==='=') setScale(s=>Math.min(1.8,+(s+.1).toFixed(2)));
      else if(e.key==='-'||e.key==='_') setScale(s=>Math.max(.8,+(s-.1).toFixed(2)));
      else if(e.key==='t'||e.key==='T') setLight(v=>!v);
      else if(e.key==='w'||e.key==='W') setMeasure(m=>m>=58?40:m+6);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);
  const total=mins(wordCount());

  return (
   <React.Fragment>
    <div className="scroll"><i style={{width:(prog*100)+'%'}}></i></div>
    <div className="bar">
      <div className="ttl">SC-3345 · Read-Aloud Script<small>Leadership Briefing — Quote Pricing Defect</small></div>
      <div className="sp"></div>
      <span className="time">⏱ ~{total} min spoken</span>
      <button onClick={()=>setScale(s=>Math.max(.8,+(s-.1).toFixed(2)))}>A−</button>
      <button onClick={()=>setScale(s=>Math.min(1.8,+(s+.1).toFixed(2)))}>A+</button>
      <button onClick={()=>setMeasure(m=>m>=58?40:m+6)}>Width</button>
      <button onClick={()=>setLight(v=>!v)}>{light?'Dark':'Light'}</button>
      <button onClick={()=>window.print()}>Print / PDF</button>
    </div>

    <div className="wrap">
      <div className="head">
        <h1>Quote Pricing Defect — Leadership Briefing</h1>
        <div className="meta">
          <span><b>Ticket:</b> SC-3345 (Critical)</span>
          <span><b>Audience:</b> Sales Cloud leadership · RevOps · Eng</span>
          <span><b>Environment:</b> UAT (test)</span>
          <span><b>The ask:</b> 2 decisions + go-ahead to build &amp; test</span>
        </div>
        <div className="legend">
          <span><i>highlighted</i> = key number / term — land it</span>
          <span><b>bold</b> = stress when read</span>
          <span style={{color:'var(--cue)'}}>▶ italic = silent delivery cue (don’t read aloud)</span>
        </div>
      </div>

      {SCRIPT.map((s,si)=>(
        <div className={"sect"+(s.end?" ":"")} id={s.id} key={s.id} style={s.end?{}:{}}>
          <div className={s.end?"end":""}>
          <h2><span className="n">{String(si+1).padStart(2,'0')}</span><span>{s.title}</span>
            {!s.end && <span className="t">~{mins(s.blocks.reduce((a,b)=>a+(((b.say||"")+(b.a||"")).replace(/[*\[\]]/g,"").split(/\s+/).filter(Boolean).length||0),0))} min</span>}
          </h2>
          {s.blocks.map((b,bi)=>{
            if(b.cue) return <div className="cue" key={bi}>{b.cue}</div>;
            if(b.q) return (<div className="qa" key={bi}><div className="q">{b.q}</div><div className="a">{inline(b.a)}</div></div>);
            return <p className="say" key={bi}>{inline(b.say)}</p>;
          })}
          </div>
        </div>
      ))}
    </div>

    <div className="dock">
      <div className={"jump"+(open?" open":"")}>
        {SCRIPT.map((s,i)=>(<a href={"#"+s.id} key={s.id} onClick={()=>setOpen(false)}>{String(i+1).padStart(2,'0')} · {s.title}</a>))}
      </div>
      <button className="toggle" onClick={()=>setOpen(v=>!v)}>{open?'✕ Close':'☰ Jump to section'}</button>
    </div>
   </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
