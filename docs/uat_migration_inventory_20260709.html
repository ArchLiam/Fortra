  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 90px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  h1{margin:0;font-size:25px;letter-spacing:-.02em;text-wrap:balance}
  .meta{margin-top:8px;color:var(--ink3);font-family:var(--mono);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
  .meta b{color:var(--ink2)}
  .lede{color:var(--ink2);font-size:14px;max-width:80ch;margin:10px 0 0}
  .banner{margin:16px 0 6px;border-radius:12px;padding:13px 18px;background:var(--live-bg);color:var(--live);border:1px solid color-mix(in srgb,var(--live) 35%,transparent);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px;margin:16px 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .card .n{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.02em}
  .card.tot .n{color:var(--live)}
  .card .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
  .chip{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input.search{flex:1;min-width:180px;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:13px}
  input.search:focus{outline:2px solid var(--accent);outline-offset:1px}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-family:var(--mono);margin:26px 0 8px}
  h2 .c{color:var(--ink2)}
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:740px;font-size:13px}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:top}
  thead th{background:var(--surface2);font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
  td.name{font-family:var(--mono);font-size:12.5px}
  td.tkt{font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
  td.why{color:var(--ink2);font-size:12.5px;min-width:240px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:99px;white-space:nowrap;color:var(--live);background:var(--live-bg)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .empty{color:var(--ink3);padding:18px;text-align:center;font-size:13px}
  .foot{color:var(--ink3);font-size:12px;margin-top:28px;border-top:1px solid var(--border);padding-top:14px}
