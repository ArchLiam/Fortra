const ORDER = { FAIL:0, BLOCKED:1, PASS:2 };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isExc = v => v && v!=="none" && v!=="—";

const counts = { PASS:0, FAIL:0, BLOCKED:0 };
RESULTS.forEach(r => { if (counts[r.verdict]!=null) counts[r.verdict]++; });
const total = RESULTS.length;
const passRate = total ? Math.round(counts.PASS/total*100) : 0;
const cleanFail = counts.FAIL===0;
const pct = k => total ? (counts[k]/total*100) : 0;

let filter = "ALL";
const openKeys = new Set();   // multi-open: each row toggles independently (opening one never closes another)
let activeDefectTab = null;   // active tab in the Defects section

function rowsFor(f){
  const list = f==="ALL" ? RESULTS.slice() : RESULTS.filter(r=>r.verdict===f);
  return list.sort((a,b)=> (ORDER[a.verdict]-ORDER[b.verdict]) || String(a.group||"").localeCompare(String(b.group||"")) || String(a.id).localeCompare(String(b.id)));
}

      <div class="cards">
        <div class="card"><div class="n">${total}</div><div class="l">Scenarios run</div></div>
        <div class="card pass"><div class="n">${counts.PASS}</div><div class="l">PASS</div></div>
        <div class="card fail"><div class="n">${counts.FAIL}</div><div class="l">FAIL</div></div>
        <div class="card block"><div class="n">${counts.BLOCKED}</div><div class="l">BLOCKED</div></div>
      </div>
      <div class="bar" title="${counts.PASS} pass · ${counts.FAIL} fail · ${counts.BLOCKED} blocked">
        <i class="p" style="width:${pct("PASS")}%"></i>
        <i class="f" style="width:${pct("FAIL")}%"></i>
        <i class="b" style="width:${pct("BLOCKED")}%"></i>
      </div>

      <div class="filters" id="filters">
        ${["ALL","PASS","FAIL","BLOCKED"].map(k=>`<span class="chip ${filter===k?"on":""}" tabindex="0" data-f="${k}">${k} · ${k==="ALL"?total:counts[k]}</span>`).join("")}
      </div>

      <div class="tablewrap">
        <table>
          <thead><tr><th>#</th><th>Category</th><th>Scenario</th><th>Record</th><th>Stage</th><th>Verdict</th></tr></thead>
          <tbody id="tbody">
            ${rows.map((r,i)=>{
              const key = r.id+"-"+i;
              const detail = openKeys.has(key) ? `
                <tr class="detail"><td colspan="6">
                  <dl>
                    <dt>expected</dt><dd>${esc(r.expected)}</dd>
                    <dt>actual</dt><dd>${esc(r.actual)}</dd>
                    <dt>evidence</dt><dd>${esc(r.evidence)}</dd>
                    <dt>exception log</dt><dd class="${isExc(r.exceptionLog)?"exc":""}">${esc(r.exceptionLog)}</dd>
                  </dl>
                </td></tr>` : "";
              return `
                <tr class="row" tabindex="0" data-key="${key}">
                  <td class="mono">${esc(r.id)}</td>
                  <td>${esc(r.category)}${r.group?`<div class="grp">${esc(r.group)}</div>`:""}</td>
                  <td>${esc(r.scenario)}${r.ticket?`<span class="muted"> · ${esc(r.ticket)}</span>`:""}</td>
                  <td class="mono">${esc(r.record)}</td>
                  <td class="muted">${esc(r.stage)}</td>
                  <td><span class="pill ${r.verdict}">${r.verdict}</span></td>
                </tr>${detail}`;
            }).join("")}
          </tbody>
        </table>
      </div>

      ${counts.FAIL>0 ? (()=>{
        const fails = RESULTS.filter(r=>r.verdict==="FAIL");
        const dtabs = [...new Set(fails.map(r=>r.defectTab||"Other"))];
        if (!dtabs.includes(activeDefectTab)) activeDefectTab = dtabs[0];
        const shown = fails.filter(r=>(r.defectTab||"Other")===activeDefectTab);
        return `
        <h2>🔴 Defects (${counts.FAIL}) — ${dtabs.length} independent workstream${dtabs.length>1?"s":""}</h2>
        <div class="filters" id="dtabs">
          ${dtabs.map(dt=>{const n=fails.filter(r=>(r.defectTab||"Other")===dt).length; return `<span class="chip ${activeDefectTab===dt?"on":""}" tabindex="0" data-dt="${esc(dt)}">${esc(dt)} · ${n}</span>`;}).join("")}
        </div>
        <div class="tablewrap"><table><thead><tr>
          <th>Scenario</th><th>Record</th><th>Expected</th><th>Actual</th><th>Exception log</th>
        </tr></thead><tbody>
          ${shown.map(r=>`
            <tr>
              <td>${esc(r.scenario)}${r.ticket?`<div class="muted mono">${esc(r.ticket)}</div>`:""}</td>
              <td class="mono">${esc(r.record)}</td><td>${esc(r.expected)}</td>
              <td style="color:var(--fail)">${esc(r.actual)}</td>
              <td class="mono">${esc(r.exceptionLog)}</td>
            </tr>`).join("")}
        </tbody></table></div>`;
      })() : ""}

      ${counts.BLOCKED>0 ? `
        <h2>⏸ Blocked (${counts.BLOCKED})</h2>
        <div class="tablewrap"><table><thead><tr><th>Scenario</th><th>Precondition needed</th></tr></thead><tbody>
          ${RESULTS.filter(r=>r.verdict==="BLOCKED").map(r=>`
            <tr><td>${esc(r.scenario)}${r.ticket?`<div class="muted mono">${esc(r.ticket)}</div>`:""}</td><td class="muted">${esc(r.evidence)}</td></tr>`).join("")}
        </tbody></table></div>` : ""}

      <h2 style="margin-top:38px">🖐 Manual / UI-only test cases (${UITESTS.length})</h2>
      <p class="muted" style="margin:-8px 0 8px;max-width:82ch">These can't be scored headlessly — Apex/API-inserted lines never enter the managed pricing context, so a headless reprice reads $0 regardless of engine correctness. <b>Click a row to expand the step-by-step repro.</b></p>
      <div class="tablewrap">
        <table>
          <thead><tr><th>#</th><th>Category</th><th>Scenario (why UI-only)</th><th>Record</th><th>Component</th><th>Type</th></tr></thead>
          <tbody id="tbody-ui">
            ${UITESTS.map(u=>{
              const key = "UI-"+u.id;
              const detail = openKeys.has(key) ? `
                <tr class="detail"><td colspan="6">
                  <dl>
                    <dt>reproduce</dt><dd><ol>${u.steps.map(s=>`<li>${s}</li>`).join("")}</ol></dd>
                    <dt>expect</dt><dd class="exp">${esc(u.expected)}</dd>
                    <dt>defect</dt><dd class="def">${esc(u.defect)}</dd>
                  </dl>
                </td></tr>` : "";
              return `
                <tr class="row" tabindex="0" data-key="${key}">
                  <td class="mono">${esc(u.id)}</td>
                  <td>${esc(u.title)}<div class="grp">§UI Manual</div></td>
                  <td>${esc(u.why)}</td>
                  <td class="mono">${esc(u.record)}</td>
                  <td class="muted">${esc(u.ticket)}</td>
                  <td><span class="pill MANUAL">MANUAL</span></td>
                </tr>${detail}`;
            }).join("")}
          </tbody>
        </table>
      </div>

      <p class="muted" style="margin-top:34px">
        Grounded in the live V21 waterfall + the S1–S14 golden harness. Idempotency = reprice ×2 byte-identical (SC-3390).
        Click any row to expand its evidence. A populated exception-log value on a PASS-looking row is itself a FAIL.
      </p>
    </div>`;

  document.getElementById("filters").querySelectorAll(".chip").forEach(el=>{
    const set = ()=>{ filter = el.dataset.f; render(); };   // keep expanded rows across filter changes
    el.addEventListener("click", set);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); set(); }});
  });
  // both tables: multi-open toggle — click to expand, click again to collapse THAT row; opening one never closes another
  document.querySelectorAll("tr.row").forEach(el=>{
    const toggle = ()=>{ const k=el.dataset.key; openKeys.has(k)?openKeys.delete(k):openKeys.add(k); render(); };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
  });
  const dtEl = document.getElementById("dtabs");
  if (dtEl) dtEl.querySelectorAll(".chip").forEach(el=>{
    const set = ()=>{ activeDefectTab = el.dataset.dt; render(); };
    el.addEventListener("click", set);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); set(); }});
  });
}
render();
</script>
